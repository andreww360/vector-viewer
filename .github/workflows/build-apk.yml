name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma fija (desde los secretos del repositorio)
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 -d > app/dev-signing.keystore
            echo "Firma fija configurada"
          else
            echo "Sin secreto DEV_KEYSTORE_BASE64: se usa la firma de depuración estándar"
          fi

      - name: Compilar APK de prueba
        env:
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AND-Vector-Viewer-${{ github.run_number }}.apk

      # Descarga cómoda desde el teléfono: pestaña "Releases" del repositorio
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Prueba ${{ github.run_number }}
          prerelease: true
          files: AND-Vector-Viewer-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: AND-Vector-Viewer-${{ github.run_number }}.apk
